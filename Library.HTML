<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Inventory System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .search-section {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }
        #searchInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #3367d6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .status-available {
            color: green;
        }
        .status-borrowed {
            color: red;
        }
        .action-btn {
            padding: 5px 10px;
            margin: 0 5px;
        }
        .borrow-btn {
            background-color: #f4b400;
        }
        .return-btn {
            background-color: #0f9d58;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Library Inventory System</h1>
        
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search by ISBN, title or author...">
            <button id="searchBtn">Search</button>
            <button id="showAllBtn">Show All Books</button>
        </div>
        
        <div id="loading" class="loading" style="display: none;">Loading data...</div>
        
        <table id="inventoryTable">
            <thead>
                <tr>
                    <th>ISBN</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Year</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="inventoryBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        // Google Sheets API configuration
        const API_KEY = 'AIzaSyC0x_6eJeCyJ9vWr7_ABVEJGatCGjjq5h0';
        const SPREADSHEET_ID = '1qtvwHNEEU8MbAZHjtIL6zt2OQcr-pxBeOj8e3yXpvzg';
        const RANGE = 'Sheet1!A2:F'; // Adjust if your data starts from a different row
        
        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const showAllBtn = document.getElementById('showAllBtn');
        const inventoryBody = document.getElementById('inventoryBody');
        const loadingElement = document.getElementById('loading');
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadInventoryData);
        
        // Event listeners
        searchBtn.addEventListener('click', searchBooks);
        showAllBtn.addEventListener('click', loadInventoryData);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchBooks();
            }
        });
        
        // Function to load all inventory data
        async function loadInventoryData() {
            try {
                showLoading(true);
                const data = await fetchSheetData();
                displayBooks(data);
            } catch (error) {
                console.error('Error loading inventory:', error);
                alert('Failed to load inventory data. Please try again.');
            } finally {
                showLoading(false);
            }
        }
        
        // Function to search books
        async function searchBooks() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            if (!searchTerm) {
                loadInventoryData();
                return;
            }
            
            try {
                showLoading(true);
                const data = await fetchSheetData();
                const filteredData = data.filter(book => 
                    book.isbn.toLowerCase().includes(searchTerm) ||
                    book.title.toLowerCase().includes(searchTerm) ||
                    book.author.toLowerCase().includes(searchTerm)
                );
                displayBooks(filteredData);
            } catch (error) {
                console.error('Error searching books:', error);
                alert('Failed to search books. Please try again.');
            } finally {
                showLoading(false);
            }
        }
        
        // Function to fetch data from Google Sheets
        async function fetchSheetData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${RANGE}?key=${API_KEY}`;
            
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.json();
            return data.values.map(row => ({
                isbn: row[0] || '',
                title: row[1] || '',
                author: row[2] || '',
                year: row[3] || '',
                status: row[4] || 'Available',
                borrower: row[5] || ''
            }));
        }
        
        // Function to display books in the table
        function displayBooks(books) {
            inventoryBody.innerHTML = '';
            
            if (books.length === 0) {
                inventoryBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No books found</td></tr>';
                return;
            }
            
            books.forEach(book => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${book.isbn}</td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.year}</td>
                    <td class="status-${book.status.toLowerCase()}">${book.status}</td>
                    <td>
                        ${book.status === 'Available' ? 
                            `<button class="action-btn borrow-btn" data-isbn="${book.isbn}">Borrow</button>` : 
                            `<button class="action-btn return-btn" data-isbn="${book.isbn}">Return</button>`}
                    </td>
                `;
                
                inventoryBody.appendChild(row);
            });
            
            // Add event listeners to action buttons
            document.querySelectorAll('.borrow-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const isbn = this.getAttribute('data-isbn');
                    updateBookStatus(isbn, 'Borrowed');
                });
            });
            
            document.querySelectorAll('.return-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const isbn = this.getAttribute('data-isbn');
                    updateBookStatus(isbn, 'Available');
                });
            });
        }
        
        // Function to update book status (Borrow/Return)
        async function updateBookStatus(isbn, newStatus) {
            const borrowerName = newStatus === 'Borrowed' ? prompt("Enter borrower's name:") : '';
            if (newStatus === 'Borrowed' && !borrowerName) return;
            
            try {
                showLoading(true);
                
                // First, get all data to find the row to update
                const data = await fetchSheetData();
                const bookIndex = data.findIndex(book => book.isbn === isbn);
                
                if (bookIndex === -1) {
                    alert('Book not found!');
                    return;
                }
                
                // Prepare the update
                const rowNumber = bookIndex + 2; // +2 because data starts from row 2 and array is 0-based
                const range = `Sheet1!E${rowNumber}:F${rowNumber}`;
                const values = [[newStatus, borrowerName || '']];
                
                // Make the update request
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}?valueInputOption=RAW&key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        range: range,
                        majorDimension: "ROWS",
                        values: values
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // Reload the data to reflect changes
                await loadInventoryData();
                alert(`Book status updated to ${newStatus}`);
                
            } catch (error) {
                console.error('Error updating book status:', error);
                alert('Failed to update book status. Please try again.');
            } finally {
                showLoading(false);
            }
        }
        
        // Helper function to show/hide loading indicator
        function showLoading(show) {
            loadingElement.style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
