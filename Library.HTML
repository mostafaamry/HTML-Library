<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Inventory System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .search-section {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }
        #searchInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #3367d6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .status-available {
            color: green;
        }
        .status-borrowed {
            color: red;
        }
        .action-btn {
            padding: 5px 10px;
            margin: 0 5px;
        }
        .borrow-btn {
            background-color: #f4b400;
        }
        .return-btn {
            background-color: #0f9d58;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Library Inventory System</h1>
        
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search by ISBN, title or author...">
            <button id="searchBtn">Search</button>
            <button id="showAllBtn">Show All Books</button>
        </div>
        
        <div id="loading" class="loading" style="display: none;">Loading data...</div>
        
        <table id="inventoryTable">
            <thead>
                <tr>
                    <th>ISBN</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Year</th>
                    <th>Status</th>
                    <th>Borrower</th>
                </tr>
            </thead>
            <tbody id="inventoryBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        // CSV file URL
        const CSV_URL = 'https://drive.google.com/uc?export=download&id=1J8Z2UTv2NyjsGiHEE180IgJUbyi8qusL';
        
        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const showAllBtn = document.getElementById('showAllBtn');
        const inventoryBody = document.getElementById('inventoryBody');
        const loadingElement = document.getElementById('loading');
        
        // Global variable to store book data
        let bookData = [];
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadInventoryData);
        
        // Event listeners
        searchBtn.addEventListener('click', searchBooks);
        showAllBtn.addEventListener('click', () => displayBooks(bookData));
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchBooks();
            }
        });
        
        // Function to load inventory data from CSV
        async function loadInventoryData() {
            try {
                showLoading(true);
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                bookData = parseCSV(csvText);
                displayBooks(bookData);
            } catch (error) {
                console.error('Error loading inventory:', error);
                alert('Failed to load inventory data. Please try again.');
            } finally {
                showLoading(false);
            }
        }
        
        // Function to parse CSV data
        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            
            return lines.slice(1).map(line => {
                const values = line.split(',');
                const book = {};
                headers.forEach((header, i) => {
                    book[header.toLowerCase()] = values[i] ? values[i].trim() : '';
                });
                return book;
            });
        }
        
        // Function to search books
        function searchBooks() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            if (!searchTerm) {
                displayBooks(bookData);
                return;
            }
            
            const filteredData = bookData.filter(book => 
                (book.isbn && book.isbn.toLowerCase().includes(searchTerm)) ||
                (book.title && book.title.toLowerCase().includes(searchTerm)) ||
                (book.author && book.author.toLowerCase().includes(searchTerm))
            );
            
            displayBooks(filteredData);
        }
        
        // Function to display books in the table
        function displayBooks(books) {
            inventoryBody.innerHTML = '';
            
            if (books.length === 0) {
                inventoryBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No books found</td></tr>';
                return;
            }
            
            books.forEach(book => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${book.isbn || ''}</td>
                    <td>${book.title || ''}</td>
                    <td>${book.author || ''}</td>
                    <td>${book.year || ''}</td>
                    <td class="status-${book.status ? book.status.toLowerCase() : 'available'}">
                        ${book.status || 'Available'}
                    </td>
                    <td>${book.borrower || ''}</td>
                `;
                
                inventoryBody.appendChild(row);
            });
        }
        
        // Helper function to show/hide loading indicator
        function showLoading(show) {
            loadingElement.style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
